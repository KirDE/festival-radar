name: Festival ingestion

on:
  workflow_dispatch:
    inputs:
      festival:
        description: Optional festival slug
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: production
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Run durable ingestion inside production
        env:
          FESTIVAL: ${{ inputs.festival }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' }}
          APP_URL: ${{ secrets.APP_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          test -n "$APP_URL" && test -n "$INTERNAL_API_SECRET"
          mkdir -p outputs
          jq -n --arg festival "$FESTIVAL" --argjson force "$FORCE" '{festival: (if $festival == "" then null else $festival end), force: $force}' > request.json
          curl --fail-with-body --silent --show-error --max-time 1200 \
            -H "authorization: Bearer $INTERNAL_API_SECRET" \
            -H "content-type: application/json" \
            --data-binary @request.json \
            "${APP_URL%/}/api/ingestion/run/" | tee outputs/ingestion-response.json
          jq -e --arg festival "$FESTIVAL" --argjson force "$FORCE" \
            -f scripts/validate-ingestion-response.jq outputs/ingestion-response.json
      - name: Refresh playlists for published lineups
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          festival_slugs="$(node scripts/select-published-festivals.mjs outputs/ingestion-response.json)"
          if test -z "$festival_slugs"; then
            echo "No published lineup changes; playlist refresh skipped."
            exit 0
          fi
          jq -n --arg festivals "$festival_slugs" '{festivals: ($festivals | split(","))}' > outputs/playlist-request.json
          curl --fail-with-body --silent --show-error --max-time 2650 \
            -H "authorization: Bearer $INTERNAL_API_SECRET" \
            -H "content-type: application/json" \
            --data-binary @outputs/playlist-request.json \
            "${APP_URL%/}/api/playlists/run/" | tee outputs/playlist-response.json
          jq -e --arg festivals "$festival_slugs" \
            '($festivals | split(",") | sort) == (.festivals | sort) and ([.status[] | .tracks > 0] | all)' \
            outputs/playlist-response.json
      - name: Retain review and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: festival-ingestion-${{ github.run_id }}
          path: outputs/ingestion-response.json
          if-no-files-found: error
          retention-days: 30
