name: Refresh or inspect festival playlists

on:
  workflow_dispatch:
    inputs:
      festival_slug:
        description: "Optional canonical festival slug for a scoped refresh or queue inspection"
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: festival-playlist-refresh
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Use the protected playlist endpoint for its active mode
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          FESTIVAL_SLUG: ${{ inputs.festival_slug }}
        run: |
          test -n "$APP_URL" && test -n "$INTERNAL_API_SECRET"
          jq -n --arg slug "$FESTIVAL_SLUG" \
            '{festivals: (if $slug == "" then null else [$slug] end)}' > request.json
          curl --fail-with-body --silent --show-error --max-time 2650 \
            -H "authorization: Bearer $INTERNAL_API_SECRET" \
            -H "content-type: application/json" \
            --data-binary @request.json \
            "${APP_URL%/}/api/playlists/run/" | tee response.json
          jq -e 'if .status == "QUEUED" then (.jobs | type == "array") else (.status | type == "object") and ([.status[] | .tracks > 0] | all) end' response.json
