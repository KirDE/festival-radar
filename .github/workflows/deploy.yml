name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: festival-radar-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:data
      - run: npm run build
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User root
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config
      - name: Deploy static export
        run: rsync -rlptDz --delete out/ production:/
      - name: Verify production
        run: |
          for attempt in {1..12}; do
            if curl --fail --silent --show-error --retry 2 --max-time 20 \
              https://festivals.kir-it.de/ | grep --quiet 'Festival Radar'; then
              exit 0
            fi
            sleep 5
          done
          exit 1
