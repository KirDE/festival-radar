name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: festival
          POSTGRES_PASSWORD: festival
          POSTGRES_DB: festival_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U festival -d festival_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://festival:festival@127.0.0.1:5432/festival_integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm run test:rockharz-update
      - run: npm run test:rockharz-update-db
      - run: npm run test:logo-assets
      - run: npm run test:playlist-queue
      - run: npm run test:sources
      - run: npm run test:catalog-db
      - run: npm run test:seed
      - run: node --import tsx --test tests/offline-catalog.e2e.test.ts
      - run: npm run test:logo-serving
      - run: npm run test:logo-serving-db
      - run: npm run test:due-worker
      # Prisma binds Date as timestamptz; exercise the source lease and fenced
      # publication against UTC-naive columns with a non-UTC database session.
      - run: printf "ALTER DATABASE festival_integration SET TimeZone TO 'Europe/Berlin';" | npx prisma db execute --stdin --schema prisma/schema.prisma
      - run: node --import tsx --test tests/ingestion-lease.e2e.test.ts && node --import tsx --test tests/ingestion-due-worker.e2e.test.mjs
        env:
          TEST_DB_TIMEZONE: Europe/Berlin
      - run: printf "ALTER DATABASE festival_integration SET TimeZone TO 'UTC';" | npx prisma db execute --stdin --schema prisma/schema.prisma
      - run: npm run test:integration
      - run: npm run test:admin:integration
      - run: npx prisma migrate reset --force
      - run: npm run test:seed
      - run: npx playwright install --with-deps chromium
      - run: npm run test:admin:e2e
      - run: npm run typecheck
      - run: npm run test:final-cutover-db
      - run: npm run test:data
      - run: npm run test:notifications:e2e
      - run: python3 -m pip install -r requirements.txt
      - run: npm run test:final-cutover
      - run: python3 -m unittest discover -s tests
      - run: npm run build
      # Exercise the actual archive: builder is Python 3.11, production is 3.9.
      - run: bash scripts/deploy/package-release.sh "$GITHUB_SHA" "$RUNNER_TEMP/python39-release.tar.gz"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - run: bash scripts/deploy/check-python39-release.sh "$RUNNER_TEMP/python39-release.tar.gz"
      - run: npm run test:routes
