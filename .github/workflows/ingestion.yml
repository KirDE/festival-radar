name: Festival ingestion

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      festival:
        description: Optional festival slug
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Refresh due festival sources
        env:
          FESTIVAL: ${{ inputs.festival }}
          APP_URL: ${{ secrets.APP_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          NOTIFICATION_DELIVERY_REQUIRED: "true"
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          INGESTION_MAX_FETCH_ERRORS: "10"
        run: |
          args=(--due --publish --output=outputs/ingestion)
          if [[ -n "$FESTIVAL" ]]; then args+=("--slug=$FESTIVAL"); fi
          npm run ingest -- "${args[@]}"
      - name: Open auditable publication pull request
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet -- data/ingestion-publications.json data/ingestion-history.jsonl; then exit 0; fi
          branch="automation/ingestion-${GITHUB_RUN_ID}"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "$branch"
          git add data/ingestion-publications.json data/ingestion-history.jsonl
          git commit -m "chore(data): publish approved festival ingestion"
          git push origin "$branch"
          gh pr create --base main --head "$branch" --title "chore(data): publish approved festival ingestion" --body "Automated policy-approved additive ingestion. Review-required changes remain in durable history and diagnostics."
      - name: Retain review and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: festival-ingestion-${{ github.run_id }}
          path: outputs/ingestion/
          if-no-files-found: error
          retention-days: 30
