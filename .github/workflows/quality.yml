name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: festival
          POSTGRES_PASSWORD: festival
          POSTGRES_DB: festival_integration
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U festival -d festival_integration"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://festival:festival@127.0.0.1:5432/festival_integration
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: npm ci
      - run: npm run prisma:generate
      - run: npx prisma migrate deploy
      - run: npm run test:integration
      - run: npm run typecheck
      - run: npm run test:data
      - run: python3 -m pip install -r requirements.txt
      - run: python3 -m unittest discover -s tests
      - run: npm run build
