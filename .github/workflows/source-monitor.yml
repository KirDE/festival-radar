name: Festival source monitor

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Check DB-configured sources inside production
        env:
          APP_URL: ${{ secrets.APP_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
        run: |
          test -n "$APP_URL" && test -n "$INTERNAL_API_SECRET"
          curl --fail-with-body --silent --show-error --max-time 600 \
            -H "authorization: Bearer $INTERNAL_API_SECRET" \
            -H "content-type: application/json" --data "{}" \
            "${APP_URL%/}/api/source-monitor/run/" | tee source-monitor-report.json
          jq -e '.status == "OK" and (.checked | type == "number" and . > 0) and .reviewRequired == 0' source-monitor-report.json
