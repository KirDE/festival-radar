name: Apply pinned reviewed festival logos

on:
  workflow_dispatch:
    inputs:
      deployment_sha:
        description: Exact main SHA already deployed and healthy (40 lowercase hex)
        required: true
        type: string
      evidence_comment:
        description: Issue 210 comment ID containing the immutable backup/restore attestation record
        required: true
        type: string
      evidence_digest:
        description: SHA256 of the exact evidence comment body
        required: true
        type: string
      restore_attested:
        description: I have backed up production and successfully restored and validated that backup in isolation
        required: true
        default: false
        type: boolean
      expected_existing:
        description: Expected bindings; 47 permits an explicitly confirmed idempotent retry
        required: true
        default: '0'
        type: choice
        options: ['0', '47']
      confirmation:
        description: Type APPLY-47-<deployment_sha>-<evidence_digest>
        required: true
        type: string

concurrency:
  group: festival-radar-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read
  issues: read

jobs:
  guarded-apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Configure required reviewers and restrict deployment branches to main.
    environment: production
    env:
      APPLY_SHA: ${{ inputs.deployment_sha }}
      EVIDENCE_COMMENT: ${{ inputs.evidence_comment }}
      EVIDENCE_DIGEST: ${{ inputs.evidence_digest }}
      RESTORE_ATTESTED: ${{ inputs.restore_attested }}
      EXPECTED_EXISTING: ${{ inputs.expected_existing }}
      APPLY_CONFIRMATION: ${{ inputs.confirmation }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require exact main Quality/Deploy and SHA-bound backup/restore attestation
        run: node scripts/deploy/check-logo-apply-gates.mjs
      - name: Configure constrained deployment SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF_CONFIG
          Host production
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User festival-radar-deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
          EOF_CONFIG
          chmod 600 ~/.ssh/config
      - name: Fresh no-write preview and exact pinned count/digest
        run: |
          if ! ssh production sudo -n /usr/local/libexec/festival-radar/activate-release "$APPLY_SHA" logo-preview > /tmp/logo-preview.audit 2>/dev/null; then
            echo 'logo preview rejected'; exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const expected = 'LOGO_IMPORT_AUDIT ' + JSON.stringify({ operation: 'reviewed-logo-import', mode: 'preview', status: 'ok',
            inventoryDigest: '99a2e164672883036310fd14639be96519a5e0765d770699bfeb98a1b06db456', sourceFiles: 47,
            existing: Number(process.env.EXPECTED_EXISTING) }) + '\n';
          if (readFileSync('/tmp/logo-preview.audit', 'utf8') !== expected) { console.error('logo preview count/digest rejected'); process.exit(1); }
          console.log('logo preview count/digest passed');
          NODE
      - name: Recheck head/evidence, apply through fixed dispatcher and verify
        run: |
          node scripts/deploy/check-logo-apply-gates.mjs
          # Every argument has been allowlisted above. Root retakes the deployment lock,
          # checks deployed SHA/health, and repeats preview/count inside the write transaction.
          if ! ssh production sudo -n /usr/local/libexec/festival-radar/activate-release "$APPLY_SHA" logo-apply "$APPLY_CONFIRMATION" "$EXPECTED_EXISTING" "$EVIDENCE_DIGEST" 2>/dev/null; then
            echo 'logo apply failed; commit may have happened; inspect via approved verify before retry or restore'; exit 1
          fi
          if ! ssh production sudo -n /usr/local/libexec/festival-radar/activate-release "$APPLY_SHA" logo-verify 2>/dev/null; then
            echo 'logo post-apply verify failed; do not declare success'; exit 1
          fi
