name: Deploy production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: festival-radar-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run test:data
      - run: npm run build
        env:
          DATABASE_URL: postgresql://build:build@127.0.0.1:5432/build
          AUTH_SECRET: build-only-secret-that-is-never-used-at-runtime
          APP_URL: https://festivals.kir-it.de
          NEXT_PUBLIC_ANALYTICS_ENDPOINT: /api/analytics/page-view/
      - name: Package standalone release
        run: bash scripts/deploy/package-release.sh "$GITHUB_SHA" release.tar.gz
      - name: Configure SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host production
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User festival-radar-deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
          EOF
          chmod 600 ~/.ssh/config
      - name: Preflight SSH access
        run: bash scripts/deploy/preflight-ssh.sh production
      - name: Create protected runtime environment
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          AUTH_SECRET: ${{ secrets.AUTH_SECRET }}
          APP_URL: ${{ secrets.APP_URL }}
          INTERNAL_API_SECRET: ${{ secrets.INTERNAL_API_SECRET }}
          ANALYTICS_OPERATOR_TOKEN: ${{ secrets.ANALYTICS_OPERATOR_TOKEN }}
          ANALYTICS_RETENTION_TOKEN: ${{ secrets.ANALYTICS_RETENTION_TOKEN }}
          ANALYTICS_RETENTION_DAYS: ${{ vars.ANALYTICS_RETENTION_DAYS || '90' }}
          SPOTIFY_CLIENT_ID: ${{ secrets.SPOTIFY_CLIENT_ID }}
          SPOTIFY_CLIENT_SECRET: ${{ secrets.SPOTIFY_CLIENT_SECRET }}
        run: |
          for name in DATABASE_URL AUTH_SECRET APP_URL INTERNAL_API_SECRET ANALYTICS_OPERATOR_TOKEN ANALYTICS_RETENTION_TOKEN SPOTIFY_CLIENT_ID SPOTIFY_CLIENT_SECRET; do
            test -n "${!name}" || { echo "Missing required production secret: $name" >&2; exit 1; }
          done
          umask 077
          {
            printf 'DATABASE_URL=%q\n' "$DATABASE_URL"
            printf 'AUTH_SECRET=%q\n' "$AUTH_SECRET"
            printf 'APP_URL=%q\n' "$APP_URL"
            printf 'INTERNAL_API_SECRET=%q\n' "$INTERNAL_API_SECRET"
            printf 'ANALYTICS_OPERATOR_TOKEN=%q\n' "$ANALYTICS_OPERATOR_TOKEN"
            printf 'ANALYTICS_RETENTION_TOKEN=%q\n' "$ANALYTICS_RETENTION_TOKEN"
            printf 'ANALYTICS_RETENTION_DAYS=%q\n' "$ANALYTICS_RETENTION_DAYS"
            printf 'ANALYTICS_RETENTION_STATE_FILE=%q\n' '/opt/festival-radar/shared/analytics-retention-state.json'
            printf 'SPOTIFY_CLIENT_ID=%q\n' "$SPOTIFY_CLIENT_ID"
            printf 'SPOTIFY_CLIENT_SECRET=%q\n' "$SPOTIFY_CLIENT_SECRET"
            printf 'NOTIFICATION_SCHEDULER_STATE_FILE=%q\n' '/opt/festival-radar/shared/notification-scheduler-state.json'
            printf 'DEPLOYED_COMMIT=%q\n' "$GITHUB_SHA"
          } > production.env
      - name: Upload and activate release
        run: |
          ssh production sudo -n /usr/local/libexec/festival-radar/upgrade-deployment-assets "$GITHUB_SHA"
          ssh production 'test "$(id -un)" = festival-radar-deploy && sudo -n /usr/local/libexec/festival-radar/activate-release 0000000000000000000000000000000000000000 2>&1 | grep -Fq "missing regular deployment input"'
          scp release.tar.gz "production:/var/lib/festival-radar-deploy/incoming/$GITHUB_SHA.tar.gz"
          scp production.env "production:/var/lib/festival-radar-deploy/incoming/$GITHUB_SHA.env"
          ssh production sudo -n /usr/local/libexec/festival-radar/activate-release "$GITHUB_SHA"
      - name: Verify production
        run: |
          for attempt in {1..12}; do
            marker="$(curl --fail --silent --show-error --retry 2 --max-time 20 \
              https://festivals.kir-it.de/api/health/deployment/)" || true
            auth_status="$(curl --silent --output /tmp/auth.json --write-out '%{http_code}' \
              --max-time 20 https://festivals.kir-it.de/api/auth/me/)" || true
            if grep --fixed-strings --quiet "\"commit\":\"$GITHUB_SHA\"" <<<"$marker" \
              && grep --fixed-strings --quiet '"database":"ok"' <<<"$marker" \
              && test "$auth_status" = 401 \
              && grep --quiet 'application/json' <(curl --silent --head https://festivals.kir-it.de/api/auth/me/) \
              && curl --fail --silent --show-error --max-time 20 https://festivals.kir-it.de/ | grep --quiet 'Festival Radar' \
              && curl --fail --silent --show-error --max-time 20 https://festivals.kir-it.de/planner/ >/dev/null \
              && curl --fail --silent --show-error --max-time 20 https://festivals.kir-it.de/festivals/wacken-open-air/ >/dev/null \
              && curl --fail --silent --show-error --max-time 20 https://festivals.kir-it.de/artists/architects/ >/dev/null; then
              exit 0
            fi
            sleep 5
          done
          exit 1
