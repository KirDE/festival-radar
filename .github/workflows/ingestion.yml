name: Festival ingestion

on:
  schedule:
    - cron: "23 3 * * *"
  workflow_dispatch:
    inputs:
      festival:
        description: Optional festival slug
        required: false

permissions:
  contents: read

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Restore per-source ingestion health
        uses: actions/cache@v4
        with:
          path: outputs/ingestion-state
          key: festival-ingestion-health-${{ github.run_id }}
          restore-keys: festival-ingestion-health-
      - name: Refresh due festival sources
        env:
          FESTIVAL: ${{ inputs.festival }}
        run: |
          args=(--due --output=outputs/ingestion --state=outputs/ingestion-state/source-state.json)
          if [[ -n "$FESTIVAL" ]]; then args+=("--slug=$FESTIVAL"); fi
          npm run ingest -- "${args[@]}"
      - name: Retain review and diagnostic artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: festival-ingestion-${{ github.run_id }}
          path: outputs/ingestion/
          if-no-files-found: error
          retention-days: 30
