name: Apply pinned reviewed festival logos

on:
  workflow_dispatch:
    inputs:
      deployment_sha:
        description: Exact main SHA already deployed and healthy (40 lowercase hex)
        required: true
        type: string
      expected_existing:
        description: Expected bindings; 47 permits an explicitly confirmed idempotent retry
        required: true
        default: '0'
        type: choice
        options: ['0', '47']
      confirmation:
        description: Type APPLY-47-<deployment_sha>
        required: true
        type: string

concurrency:
  group: festival-radar-production
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:
  guarded-apply:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Secret scoping only: this environment has no independent approval protection.
    environment: production
    env:
      APPLY_SHA: ${{ inputs.deployment_sha }}
      EXPECTED_EXISTING: ${{ inputs.expected_existing }}
      APPLY_CONFIRMATION: ${{ inputs.confirmation }}
      GITHUB_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Require exact main Quality and Deploy
        run: node scripts/deploy/check-logo-apply-gates.mjs
      - name: Configure constrained deployment SSH
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
          DEPLOY_PORT: ${{ secrets.DEPLOY_PORT }}
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF_CONFIG
          Host production
            HostName $DEPLOY_HOST
            Port $DEPLOY_PORT
            User festival-radar-deploy
            IdentityFile ~/.ssh/deploy_key
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
            ConnectTimeout 15
          EOF_CONFIG
          chmod 600 ~/.ssh/config
      - name: Fresh no-write preview and exact pinned count/digest
        run: |
          if ! ssh production sudo -n /usr/local/libexec/festival-radar/activate-release "$APPLY_SHA" logo-preview > /tmp/logo-preview.audit 2>/dev/null; then
            echo 'logo preview rejected'; exit 1
          fi
          node --input-type=module <<'NODE'
          import { readFileSync } from 'node:fs';
          const expected = 'LOGO_IMPORT_AUDIT ' + JSON.stringify({ operation: 'reviewed-logo-import', mode: 'preview', status: 'ok',
            inventoryDigest: '99a2e164672883036310fd14639be96519a5e0765d770699bfeb98a1b06db456', sourceFiles: 47,
            existing: Number(process.env.EXPECTED_EXISTING) }) + '\n';
          if (readFileSync('/tmp/logo-preview.audit', 'utf8') !== expected) { console.error('logo preview count/digest rejected'); process.exit(1); }
          console.log('logo preview count/digest passed');
          NODE
      - name: Obtain root-owned SHA/source-bound fresh restore proof
        id: root-proof
        run: |
          if ! ssh production sudo -n /usr/local/libexec/festival-radar/activate-release "$APPLY_SHA" logo-proof > /tmp/logo-restore-proof.audit 2>/dev/null; then
            echo 'root restore proof unavailable; apply blocked'; exit 1
          fi
          node scripts/deploy/check-logo-apply-gates.mjs proof-audit < /tmp/logo-restore-proof.audit >> "$GITHUB_OUTPUT"
      - name: Recheck main, apply with root proof revalidation and verify
        env:
          ROOT_PROOF_DIGEST: ${{ steps.root-proof.outputs.proof_digest }}
        run: |
          node scripts/deploy/check-logo-apply-gates.mjs
          # Proof digest is derived from root output, never a workflow input.
          # Root revalidates the protected proof AND the pinned artifacts/source/freshness
          # inside the deployment lock immediately before starting the write unit.
          [[ "$ROOT_PROOF_DIGEST" =~ ^[0-9a-f]{64}$ ]] || { echo 'root proof digest rejected'; exit 1; }
          if ! ssh production sudo -n /usr/local/libexec/festival-radar/activate-release "$APPLY_SHA" logo-apply "$APPLY_CONFIRMATION" "$EXPECTED_EXISTING" "$ROOT_PROOF_DIGEST" 2>/dev/null; then
            echo 'logo apply failed; commit may have happened; inspect via approved verify before retry or restore'; exit 1
          fi
          if ! ssh production sudo -n /usr/local/libexec/festival-radar/activate-release "$APPLY_SHA" logo-verify 2>/dev/null; then
            echo 'logo post-apply verify failed; do not declare success'; exit 1
          fi
